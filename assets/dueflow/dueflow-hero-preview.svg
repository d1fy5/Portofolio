<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF4EF"/>
      <stop offset="50%" stop-color="#E2EDE4"/>
      <stop offset="100%" stop-color="#D4E4D7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBFDFB"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#17352C" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>

  <!-- Topographic decorative contours -->
  <g fill="none" stroke="#7FAF8F" stroke-width="1.2" opacity="0.45">
    <ellipse cx="600" cy="380" rx="680" ry="460" stroke-dasharray="8 4"/>
    <ellipse cx="600" cy="380" rx="580" ry="390"/>
    <ellipse cx="600" cy="380" rx="480" ry="320"/>
    <ellipse cx="600" cy="380" rx="380" ry="250"/>
    <ellipse cx="600" cy="380" rx="280" ry="180"/>
  </g>

  <!-- Floating Browser App Window -->
  <g transform="translate(100, 60)" filter="url(#shadow)">
    <!-- Window Frame -->
    <rect width="1000" height="630" rx="16" fill="#FFFFFF" stroke="#E3E9E3" stroke-width="1.5"/>
    
    <!-- Chrome Bar -->
    <path d="M 0 16 Q 0 0 16 0 L 984 0 Q 1000 0 1000 16 L 1000 48 L 0 48 Z" fill="#EEF4EF"/>
    <line x1="0" y1="48" x2="1000" y2="48" stroke="#E3E9E3" stroke-width="1"/>
    
    <!-- Chrome Dots -->
    <circle cx="28" cy="24" r="5.5" fill="#EF4444" opacity="0.8"/>
    <circle cx="46" cy="24" r="5.5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="64" cy="24" r="5.5" fill="#10B981" opacity="0.8"/>

    <!-- URL Pill -->
    <rect x="330" y="12" width="340" height="24" rx="12" fill="#FFFFFF" stroke="#DCE8DF" stroke-width="1"/>
    <text x="500" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#66736A" text-anchor="middle" font-weight="500">app.dueflow.io / today</text>

    <!-- App Inner Header -->
    <g transform="translate(40, 75)">
      <!-- Brand Logo / Wordmark -->
      <rect x="0" y="0" width="32" height="32" rx="8" fill="#17352C"/>
      <path d="M 10 10 L 22 10 C 25 10 25 22 22 22 L 10 22 Z M 14 14 L 14 18 L 19 18 C 20.5 18 20.5 14 19 14 Z" fill="#DCE8DF"/>
      <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="19" font-weight="700" fill="#17352C" letter-spacing="-0.5">DueFlow</text>
      <rect x="135" y="6" width="62" height="20" rx="10" fill="#DCE8DF"/>
      <text x="166" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="700" fill="#285445" text-anchor="middle" letter-spacing="0.5">BETA</text>

      <!-- User Avatar -->
      <circle cx="900" cy="16" r="16" fill="#17352C"/>
      <text x="900" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#DCE8DF" text-anchor="middle">DA</text>
    </g>

    <!-- App Content Area -->
    <g transform="translate(40, 130)">
      <!-- Eyebrow & Title -->
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#527663" letter-spacing="1">TODAY'S OVERVIEW</text>
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="700" fill="#17352C" letter-spacing="-0.5">Good morning, Daffa</text>

      <!-- Stat Cards -->
      <g transform="translate(0, 48)">
        <!-- Stat 1 -->
        <rect x="0" y="0" width="290" height="74" rx="10" fill="#F7F8F5" stroke="#E3E9E3"/>
        <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#66736A" font-weight="500">Outstanding Invoices</text>
        <text x="16" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" fill="#17352C" font-weight="700">$5,420</text>
        <rect x="206" y="26" width="68" height="22" rx="11" fill="#DCE8DF"/>
        <text x="240" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="600" fill="#285445" text-anchor="middle">3 active</text>

        <!-- Stat 2 -->
        <rect x="315" y="0" width="290" height="74" rx="10" fill="#F7F8F5" stroke="#E3E9E3"/>
        <text x="331" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#66736A" font-weight="500">Due This Week</text>
        <text x="331" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" fill="#17352C" font-weight="700">$2,150</text>
        <rect x="525" y="26" width="66" height="22" rx="11" fill="#FEF3C7"/>
        <text x="558" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="600" fill="#92400E" text-anchor="middle">2 due</text>

        <!-- Stat 3 -->
        <rect x="630" y="0" width="290" height="74" rx="10" fill="#17352C"/>
        <text x="646" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#B7CCBA" font-weight="500">Follow-Ups Needed</text>
        <text x="646" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" fill="#FFFFFF" font-weight="700">1 Ready</text>
        <rect x="836" y="26" width="68" height="22" rx="11" fill="#285445"/>
        <text x="870" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="600" fill="#DCE8DF" text-anchor="middle">Review</text>
      </g>

      <!-- Main Invoices Panel & Reminder Card -->
      <g transform="translate(0, 142)">
        <!-- Invoices Table (Left) -->
        <g>
          <rect x="0" y="0" width="550" height="210" rx="12" fill="#FFFFFF" stroke="#E3E9E3"/>
          <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" fill="#17352C">Recent Invoices</text>
          <text x="530" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#285445" text-anchor="end">View all</text>
          <line x1="0" y1="48" x2="550" y2="48" stroke="#E3E9E3"/>

          <!-- Row 1 -->
          <g transform="translate(20, 62)">
            <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#17352C">Marlowe Studio</text>
            <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#66736A">Brand refresh — phase 2</text>
            <text x="320" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#66736A">Due in 2 days</text>
            <text x="430" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#17352C">$1,850</text>
            <circle cx="496" cy="20" r="4" fill="#F59E0B"/>
          </g>
          <line x1="20" y1="108" x2="530" y2="108" stroke="#F1F5F1"/>

          <!-- Row 2 -->
          <g transform="translate(20, 118)">
            <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#17352C">Ridgeway &amp; Co.</text>
            <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#66736A">Website copy audit</text>
            <text x="320" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#EF4444" font-weight="500">6d overdue</text>
            <text x="430" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#17352C">$960</text>
            <circle cx="496" cy="20" r="4" fill="#EF4444"/>
          </g>
          <line x1="20" y1="162" x2="530" y2="162" stroke="#F1F5F1"/>

          <!-- Row 3 -->
          <g transform="translate(20, 172)">
            <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#17352C">Hale Botanics</text>
            <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#66736A">Packaging design sprint</text>
            <text x="320" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#66736A">Due in 9 days</text>
            <text x="430" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#17352C">$1,420</text>
            <circle cx="496" cy="16" r="4" fill="#10B981"/>
          </g>
        </g>

        <!-- Reminder Draft Card (Right) -->
        <g transform="translate(570, 0)">
          <rect width="350" height="210" rx="12" fill="#F7F8F5" stroke="#DCE8DF"/>
          <g transform="translate(20, 20)">
            <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#527663" letter-spacing="0.5">READY TO SEND</text>
            <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700" fill="#17352C">Polite Follow-up #1</text>
            <rect x="0" y="46" width="310" height="74" rx="8" fill="#FFFFFF" stroke="#E3E9E3"/>
            <text x="12" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#17352C">Re: Invoice INV-201 — Website copy audit</text>
            <text x="12" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" fill="#66736A">"Hi Sarah, hope your week is off to a great start! Just a gentle</text>
            <text x="12" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" fill="#66736A">reminder regarding invoice INV-201 due last Thursday..."</text>

            <rect x="0" y="132" width="145" height="30" rx="15" fill="#17352C"/>
            <text x="72" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Send Reminder →</text>
            <rect x="155" y="132" width="90" height="30" rx="15" fill="#FFFFFF" stroke="#DCE8DF"/>
            <text x="200" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#66736A" text-anchor="middle">Edit Draft</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>