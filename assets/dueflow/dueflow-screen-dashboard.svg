<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F8F5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#screenBg)"/>
  
  <!-- Header Bar -->
  <rect width="800" height="54" fill="#EEF4EF" stroke="#E3E9E3" stroke-width="1"/>
  <circle cx="28" cy="27" r="5" fill="#17352C" opacity="0.3"/>
  <circle cx="44" cy="27" r="5" fill="#17352C" opacity="0.3"/>
  <circle cx="60" cy="27" r="5" fill="#17352C" opacity="0.3"/>

  <!-- Logo and title in bar -->
  <text x="85" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#17352C">DueFlow</text>
  <rect x="150" y="16" width="220" height="22" rx="11" fill="#FFFFFF" stroke="#DCE8DF"/>
  <text x="260" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#66736A" text-anchor="middle">app.dueflow.io / today</text>

  <!-- Content -->
  <g transform="translate(36, 80)">
    
  <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="700" fill="#17352C">Good morning · Today's Follow-ups</text>
  <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#66736A">2 invoices need attention · 1 automated email draft waiting</text>

  <!-- Top Metrics -->
  <g transform="translate(0, 60)">
    <rect x="0" y="0" width="230" height="74" rx="10" fill="#FFFFFF" stroke="#E3E9E3"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#66736A">Total Outstanding</text>
    <text x="16" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="700" fill="#17352C">$5,420</text>

    <rect x="250" y="0" width="230" height="74" rx="10" fill="#FFFFFF" stroke="#E3E9E3"/>
    <text x="266" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#66736A">Due this week</text>
    <text x="266" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="700" fill="#285445">2 Invoices</text>

    <rect x="500" y="0" width="228" height="74" rx="10" fill="#FFFFFF" stroke="#E3E9E3"/>
    <text x="516" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" fill="#66736A">Average turnaround</text>
    <text x="516" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="700" fill="#17352C">8.4 days</text>
  </g>

  <!-- Action Alert Card -->
  <g transform="translate(0, 155)">
    <rect width="728" height="180" rx="12" fill="#EEF4EF" stroke="#DCE8DF"/>
    <g transform="translate(24, 28)">
      <rect width="90" height="20" rx="10" fill="#DCE8DF"/>
      <text x="45" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="700" fill="#17352C" text-anchor="middle">URGENT REMINDER</text>
      <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="700" fill="#17352C">Ridgeway &amp; Co. invoice is 6 days overdue</text>
      <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" fill="#527663">A courteous email reminder draft has been prepared based on template #2.</text>
      
      <rect x="0" y="90" width="140" height="34" rx="17" fill="#17352C"/>
      <text x="70" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Review &amp; Send →</text>
      <rect x="155" y="90" width="110" height="34" rx="17" fill="#FFFFFF" stroke="#DCE8DF"/>
      <text x="210" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600" fill="#66736A" text-anchor="middle">Snooze 3 days</text>
    </g>
  </g>

  </g>
</svg>